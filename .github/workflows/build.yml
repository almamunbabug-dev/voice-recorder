name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: tar xzf project.tgz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: VoiceRecorder
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp VoiceRecorder/app/build/outputs/apk/debug/app-debug.apk VoiceRecorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceRecorder-apk
          path: VoiceRecorder.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Voice Recorder v1.0.${{ github.run_number }}
          files: VoiceRecorder.apk
          make_latest: true
