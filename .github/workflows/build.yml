name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: tar xJf project.txz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: VoiceVault
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp VoiceVault/app/build/outputs/apk/debug/app-debug.apk VoiceVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceVault-apk
          path: VoiceVault.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: VoiceVault v2.0.${{ github.run_number }}
          files: VoiceVault.apk
          make_latest: true
